security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginAuthenticator
            logout:
                path: app_logout

    role_hierarchy:
        ROLE_ADMIN: [ROLE_CLIENT, ROLE_CLIENT_SERVICE, ROLE_SELLER, ROLE_MECHANIC, ROLE_CAR_RENTAL_SERVICE]

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/client, roles: ROLE_CLIENT }
        - { path: ^/service, roles: ROLE_CLIENT_SERVICE }
        - { path: ^/seller, roles: ROLE_SELLER }
        - { path: ^/mechanic, roles: ROLE_MECHANIC }
        - { path: ^/rental, roles: ROLE_CAR_RENTAL_SERVICE }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
