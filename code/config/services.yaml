parameters:
    client_directory: '%kernel.project_dir%/public/uploads/client'  # Define the upload directory
parameters:
    upload_directory: '%kernel.project_dir%/public/uploads'
    TWILIO_ACCOUNT_SID: '%env(TWILIO_ACCOUNT_SID)%'
    TWILIO_AUTH_TOKEN: '%env(TWILIO_AUTH_TOKEN)%'
    TWILIO_FROM_NUMBER: '%env(TWILIO_FROM_NUMBER)%'
    TWILIO_CONTENT_SID: '%env(TWILIO_CONTENT_SID)%'

services:
    # Default configuration for services in this file
    _defaults:
        autowire: true
        autoconfigure: true

    # Services for controllers (automatically wired and configured)
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'

    Twilio\Rest\Client:
        arguments:
            - '%TWILIO_ACCOUNT_SID%'
            - '%TWILIO_AUTH_TOKEN%'

    App\Service\AuthClient\WhatsAppVerificationCodeSender:
    # Bind the ChartBuilderInterface to the TestController constructor
    #    App\Controller\AdminController\TestController:
    #        bind:
    #            $chartBuilder: '@Symfony\UX\Chartjs\Builder\ChartBuilderInterface'

    # FileUploader service, passing the client_directory parameter
    App\Service\FileUploader:
        arguments:
            $targetDirectory: '%kernel.project_dir%/public/uploads'

    App\Service\CRUD\MechanicService:
        autowire: true
    App\Service\CRUD\SellerService:
        autowire: true
    App\Repository\:
        resource: '../src/Repository/'
        tags: [ 'doctrine.repository_service' ]
        autowire: true
        autoconfigure: true
    App\Controller\MenuController:
        tags: ['controller.service_arguments']
    App\Service\AuthService:
        autowire: true
        autoconfigure: true
            $twilio: '@Twilio\Rest\Client'
            $cache: '@cache.app'
            $logger: '@logger'
            $twilioFromNumber: '%TWILIO_FROM_NUMBER%'
            $twilioContentSid: '%TWILIO_CONTENT_SID%'

    App\Service\FileUploader:
        arguments:
            $targetDirectory: '%upload_directory%'
