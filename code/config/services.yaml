parameters:
    client_directory: '%kernel.project_dir%/public/uploads/client'  # Define the upload directory

services:
    # Default configuration for services in this file
    _defaults:
        autowire: true
        autoconfigure: true

    # Services for controllers (automatically wired and configured)
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # Bind the ChartBuilderInterface to the TestController constructor
#    App\Controller\AdminController\TestController:
#        bind:
#            $chartBuilder: '@Symfony\UX\Chartjs\Builder\ChartBuilderInterface'

    # FileUploader service, passing the client_directory parameter
    App\Service\FileUploader:
        arguments:
            $targetDirectory: '%kernel.project_dir%/public/uploads'
#            $targetDirectory: '%kernel.project_dir%/public/uploads/mechanics'

    App\Service\CRUD\MechanicService:
        autowire: true
    App\Service\CRUD\SellerService:
        autowire: true
    App\Repository\:
        resource: '../src/Repository/'
        tags: [ 'doctrine.repository_service' ]
        autowire: true
        autoconfigure: true
    App\Controller\MenuController:
        tags: ['controller.service_arguments']
    App\Service\AuthService:
        autowire: true
        autoconfigure: true

