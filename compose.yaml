version: '3.8'

services:
  nginx:
    image: nginx-nginx:latest
    build:
      context: ./infra/
      args:
        BUILD_ARGUMENT_ENV: dev
      dockerfile: ./nginx/Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./code:/var/www/html:ro,cached
      - ./infra/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - symfony
    networks:
      - symfony

  symfony:
    image: php-symfony:latest
    build:
      context: ./infra/
      dockerfile: ./php/Dockerfile
    volumes:
      - ./code:/var/www/html:cached
      - ./infra/php/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf
      - ./infra/php/config/php.ini:/usr/local/etc/php/php.ini
    ports:
      - "8000:8000"
    command: php-fpm
    depends_on:
      - mysql
    networks:
      - symfony

  mysql:
    image: mysql
    platform: linux/x86_64
    command: --innodb-use-native-aio=${INNODB_USE_NATIVE_AIO:-1} --sql_mode=${SQL_MODE:-"ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"}
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: symfony
    ports:
      - "3306:3306"
    volumes:
      - mysql:/var/lib/mysql:delegated
    networks:
      - symfony

  myadmin:
    image: phpmyadmin/phpmyadmin:5
    environment:
      PMA_HOST: mysql
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - symfony
    volumes:
      - db_admin_data:/var/www/html

  python:
    image: fastapi-service:latest
    build:
      context: ./infra/
      dockerfile: ./python/Dockerfile
    ports:
      - "8001:8000"
    volumes:
    - ./infra/python_service:/app
    networks:
      - symfony

  mercure:
    image: dunglas/mercure:v0.14
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '8f97443755930bbd1f06032d2a07fc185387c187c23d227b254fa6b6bf715946'
      MERCURE_SUBSCRIBER_JWT_KEY: '8f97443755930bbd1f06032d2a07fc185387c187c23d227b254fa6b6bf715946'
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins *
        anonymous
        subscriptions
        publish_allowed_origins *
        demo
      ALLOW_ANONYMOUS: 1
      CORS_ALLOWED_ORIGINS: "*"
      USE_FORWARDED_HEADERS: 1
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    networks:
      - symfony

volumes:
  db_admin_data:
  mysql:
  mercure_data:
  mercure_config:

networks:
  symfony:
    name: symfony
